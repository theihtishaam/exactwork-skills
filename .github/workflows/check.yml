name: Package checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s skills/exactwork-context/tests -v
      - run: python -B evals/v0.2/learn-review/test_independent_review.py
      - run: python -B -m unittest discover -s evals/v0.2/public_eval_tools -p test_public_tools.py -v
      - run: python -B evals/v0.2/audit_results.py
      - run: python -B evals/v0.2/test_audit_results.py evals/v0.2
      - run: python tools/validate.py
