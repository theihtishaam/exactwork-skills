<path d="M750 444 L1350 444" stroke="#2A4054" stroke-width="2" fill="none"/>
<text x="750" y="485" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">source lines</text>
<text x="1222" y="485" fill="#F3F7FC" font-family="Consolas, monospace" font-size="21" font-weight="700">11</text>
