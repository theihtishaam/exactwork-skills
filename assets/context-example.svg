<text x="1222" y="524" fill="#F3F7FC" font-family="Consolas, monospace" font-size="21" font-weight="700">2</text>
<text x="750" y="563" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">selected lines</text>
<text x="1222" y="563" fill="#F3F7FC" font-family="Consolas, monospace" font-size="21" font-weight="700">3</text>
<text x="750" y="602" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">omitted requested lines</text>
<text x="1222" y="602" fill="#F3F7FC" font-family="Consolas, monospace" font-size="21" font-weight="700">2</text>
<text x="750" y="641" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">complete_for_selection</text>
<text x="1222" y="641" fill="#F5B56C" font-family="Consolas, monospace" font-size="21" font-weight="700">false</text>
<text x="750" y="680" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">source_process_status</text>
<text x="1222" y="680" fill="#F5B56C" font-family="Consolas, monospace" font-size="21" font-weight="700">unknown</text>
<rect x="64" y="782" width="1312" height="106" rx="18" fill="#153239"/>
<text x="88" y="823" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">EXPAND THE RELEVANT RANGE</text>
<text x="88" y="862" fill="#F3F7FC" font-family="Consolas, monospace" font-size="23" font-weight="700">--range 4:5</text>
<text x="343" y="862" fill="#F3F7FC" font-family="Consolas, monospace" font-size="23" font-weight="400">→  05  Detail: row=2 date=not-a-date</text>
<text x="64" y="936" fill="#A6B8C9" font-family="Consolas, monospace" font-size="20" font-weight="400">Initial arguments: --query &quot;request=42&quot; --context 1 --max-lines 3</text>
<text x="64" y="982" fill="#F5B56C" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">The request=99 failure is outside this query. Expand your search for a complete failure inventory.</text>
<text x="64" y="1025" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">An extraction succeeds when it reads text. That does not mean the source job succeeded.</text>
</svg>