<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">An illustrative export bug task</title><desc id="desc">A fictional example of applying Exactwork: specify the contract, reproduce empty-input behavior, inspect the affected path, fix the scoped defect, check empty and normal inputs, and report observed outcomes. These are example steps, not an additional benchmark result.</desc>
<rect width="1440" height="940" fill="#071321"/>
<text x="64" y="62" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">A TASK IN PRACTICE / ILLUSTRATIVE WALKTHROUGH</text>
<text x="64" y="119" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">From a bug report to a checked result.</text>
<text x="64" y="163" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Example: an export fails on empty input. Preserve the existing output format.</text>
<rect x="64" y="216" width="1312" height="128" rx="18" fill="#102235"/>
<text x="90" y="269" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">01</text>
<text x="164" y="266" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Agree on the result</text>
<text x="650" y="264" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Empty input returns the documented empty result.</text>
<text x="650" y="304" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">The existing format and normal inputs still work.</text>
<rect x="64" y="365" width="1312" height="128" rx="18" fill="#102235"/>
<text x="90" y="418" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">02</text>
<text x="164" y="415" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Find the failing path</text>
<text x="650" y="413" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Reproduce the case and inspect the relevant code.</text>
<text x="650" y="453" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Confirm the cause before selecting a fix.</text>
<rect x="64" y="514" width="1312" height="128" rx="18" fill="#102235"/>
<text x="90" y="567" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">03</text>
<text x="164" y="564" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Make the scoped change</text>
<text x="650" y="562" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Change the behavior needed to satisfy the contract.</text>
<text x="650" y="602" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Include affected callers when the contract requires it.</text>
<rect x="64" y="663" width="1312" height="128" rx="18" fill="#153239"/>
<text x="90" y="716" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">04</text>
<text x="164" y="713" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Check and report</text>
<text x="650" y="711" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Run the empty-input and normal-input checks.</text>
<text x="650" y="751" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Report what ran, what passed, and what remains unverified.</text>
<text x="64" y="870" fill="#F5B56C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Illustration of the intended workflow. It is not a measured success claim.</text>
</svg>