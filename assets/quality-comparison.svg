<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
<title id="title">Task correctness in the matched comparison</title><desc id="desc">All four tested conditions achieved5of5 public-task passes on a three-unique-task coding subset. No accuracy lead was measured. Other eight external projects and named-model intelligence gains were not evaluated. Empty measurements are not zero scores.</desc>
<rect width="1440" height="970" fill="#071321"/>
