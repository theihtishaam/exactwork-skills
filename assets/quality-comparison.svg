<text x="90" y="712" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Equal pass counts. No accuracy lead established.</text>
<text x="90" y="750" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Lower token usage on this subset is an efficiency observation, not an intelligence score.</text>
<text x="64" y="819" fill="#F5B56C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Other eight external projects: no matched quality measurements in this release.</text>
<text x="64" y="863" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Ponytail ran later; core instructions only. Cache and exact inherited model were uncontrolled.</text>
<text x="64" y="907" fill="#F5B56C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Small sample: do not infer general quality or superiority across models and tools.</text>
<text x="64" y="950" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400">Source: evals/v0.2/final-results.json / summary.matched_coding_subset.</text>
