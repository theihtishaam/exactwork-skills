<text x="64" y="120" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Different procedures. Inspectable evidence.</text>
<text x="64" y="165" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Ponytail 5.3.3 core and Exactwork 0.2  |  Checked 12 Nov 2026</text>
