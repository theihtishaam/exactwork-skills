<title id="title">Measured token use and task outcomes</title><desc id="desc">Two held-out tasks, three trials each per condition. All three conditions pass six of six public-task checks after a documented blind grader audit. Aggregate tokens are817122 for no skill,761789 for version0.1 and704714 for compact0.2. Savings occur in only three of six paired trials; the log task uses more tokens.</desc>
