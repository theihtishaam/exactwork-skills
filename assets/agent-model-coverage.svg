<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Agent compatibility and model evidence</title><desc id="desc">Four documented client destinations are compared. Installation of six skills into a Codex project with Skills CLI was checked locally. Native activation in every client was not tested. The behavioral study used Codex CLI with inherited model identity undisclosed. No named GPT, Claude, or DeepSeek model uplift was measured.</desc>
<rect width="1440" height="1040" fill="#071321"/>
<text x="64" y="62" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">AGENT TOOLS + MODELS / COMPARE THE EVIDENCE</text>
<text x="64" y="119" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Portable instructions. Different host applications.</text>
<text x="64" y="163" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Installation support and measured model improvements are separate questions.</text>
<rect x="64" y="216" width="1312" height="465" rx="18" fill="#102235"/>
<text x="90" y="262" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">AGENT TOOL</text>
<text x="360" y="262" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">PROJECT SKILL DIRECTORY</text>
<text x="830" y="262" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">AVAILABLE INSTALLATION EVIDENCE</text>
