<text x="360" y="530" fill="#F3F7FC" font-family="Consolas, monospace" font-size="23" font-weight="400">.opencode/skills/</text>
<text x="830" y="518" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Documented destination</text>
