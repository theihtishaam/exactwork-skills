<rect x="64" y="713" width="1312" height="202" rx="18" fill="#153239"/>
<text x="90" y="758" fill="#56DCDD" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">MODEL COMPARISON / WHAT IS ACTUALLY KNOWN</text>
<text x="90" y="805" fill="#F3F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">35 scored runs through Codex CLI; inherited model identity was not exposed.</text>
<text x="90" y="850" fill="#F5B56C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Named GPT, Claude and DeepSeek model gains: not measured in this release.</text>
<text x="90" y="888" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">An agent application is not a model. A portable skill does not establish equal gains across models.</text>
<text x="64" y="972" fill="#A6B8C9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Paths: docs/compatibility.md (2026-11-12). Install smoke check: docs/installation-smoke.md.</text>
